version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tokiyo-db
    restart: always
    environment:
      POSTGRES_USER: tokiyo
      POSTGRES_PASSWORD: tokiyo_password
      POSTGRES_DB: tokiyo_cloud
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tokiyo-redis
    restart: always
    volumes:
      - redisdata:/data

  orchestrator:
    build: .
    container_name: tokiyo-orchestrator
    restart: always
    ports:
      - "3000:3000"
    environment:
      START_SERVER: "true"
      # Use internal Docker DNS to connect to the db and redis containers
      DATABASE_URL: "postgresql://tokiyo:tokiyo_password@db:5432/tokiyo_cloud?schema=public"
      REDIS_URL: "redis://redis:6379"
      # If you have a Gemini API key for the Perception Engine, pass it here:
      # GEMINI_API_KEY: "your-api-key"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  redisdata:
